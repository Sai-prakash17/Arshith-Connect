<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4A34"/>
      <stop offset="100%" stop-color="#092C1F"/>
    </linearGradient>
    <linearGradient id="magentaDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#960466"/>
    </linearGradient>
    <linearGradient id="tealDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#02708b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Stylized Brand Letter 'A' -->
  <text x="14" y="47" font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="40" font-weight="900" fill="#ffffff">A</text>
  <!-- Trademark Dual Dots -->
  <circle cx="42" cy="24" r="6.5" fill="url(#tealDot)" />
  <circle cx="48" cy="16" r="7" fill="url(#magentaDot)" />
  <!-- Green Accent Underline Swoosh -->
  <path d="M 14 52 L 48 48.5 L 28 54 Z" fill="#22c55e" />
</svg>